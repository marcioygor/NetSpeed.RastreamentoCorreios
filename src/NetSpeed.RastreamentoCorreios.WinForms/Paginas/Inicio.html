<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 40px; background: #fff; color: #26394b; font: 14px/1.6 'Segoe UI', sans-serif; }
    main { max-width: 620px; }
    h1 { margin: 0 0 14px; color: #1d405c; font-size: 23px; font-weight: 600; line-height: 1.3; }
    p { margin: 0 0 12px; }
    @media (max-width: 600px) { body { padding: 24px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <main>
    <h1>Rastreamento de objetos</h1>
    <p>Informe um ou mais códigos de rastreamento no campo superior e clique em Consultar.</p>
    <p>A navegação será exibida neste painel. Os resultados aparecerão no painel ao lado.</p>
  </main>
</body>
</html>
